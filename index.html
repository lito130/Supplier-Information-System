<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supplier Information System</title>
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/lito130/supplier-directory/main/pngtree-ic-electronic-chip-in-cartoon-style-vector-illustration-png-image_9163673.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0e1a; }
    iframe { width: 100%; height: 100vh; border: none; display: block; }

    #loader {
      position: fixed;
      inset: 0;
      background: #0a0e1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.6s ease;
    }
    #loader.hidden { opacity: 0; pointer-events: none; }
    #loader img { width: 72px; height: 72px; margin-bottom: 24px; object-fit: contain; }
    .spinner {
      width: 44px; height: 44px;
      border: 4px solid rgba(79,70,229,0.2);
      border-top-color: #4f46e5;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loader p { color: #94a3b8; margin-top: 18px; font-family: 'Segoe UI', sans-serif; font-size: 14px; letter-spacing: 0.5px; }

    .error-msg {
      color: #ef4444;
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      padding: 20px;
    }
  </style>
<base target="_blank">
</head>
<body>
  <div id="loader">
    <img src="https://raw.githubusercontent.com/lito130/supplier-directory/main/pngtree-ic-electronic-chip-in-cartoon-style-vector-illustration-png-image_9163673.png" alt="Logo">
    <div class="spinner"></div>
    <p>Loading Supplier Information System…</p>
  </div>

  <iframe 
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbx8ivpDq2IjSw2aqWj_vbwizCKDEC-ppCAuv6U2Fz_uOBPRwvcM6DBU4J1OeVUAEHEA3Q/exec" 
    allowfullscreen
    onload="document.getElementById('loader').classList.add('hidden')">
  </iframe>

  <script>
    setTimeout(function() {
      document.getElementById('loader').classList.add('hidden');
    }, 12000);
  </script>
</body>
</html>
